<!doctype html>
<!--
  Dev tool: cuts OCR glyph templates out of the sample screenshots using the ground truth
  in tools/samples.js and prints the content of js/ocr_glyphs.js into <pre id="out">.
  Run via tools/build_glyphs.ps1 (headless Edge). Needs --allow-file-access-from-files.
-->
<html><head><meta charset="utf-8"><title>Glyph harvester</title></head>
<body>
<pre id="log"></pre>
<pre id="out">PENDING</pre>
<script src="../js/util.js"></script>
<script src="../js/ocr.js"></script>
<script src="../js/calibrate.js"></script>
<script src="../js/layouts/index.js"></script>
<script src="../js/layouts/rtb2004.js"></script>
<script src="synthetic_glyphs.js"></script>
<script src="samples.js"></script>
<script>
const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; };

function loadImg(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0);
      res(x.getImageData(0, 0, im.width, im.height));
    };
    im.onerror = () => rej(new Error('cannot load ' + src));
    im.src = src;
  });
}

(async () => {
  const small = {};   // ch -> [bits]
  const aa = {};      // ch|em -> [templates]
  for (const s of SAMPLES) {
    const img = await loadImg('../samples/' + s.file);
    const L = App.layouts.get(s.layout);
    // --- anti-aliased header
    for (const [name, text] of Object.entries(s.header)) {
      const r = App.ocr.harvestAA(img, L.REGIONS[name], L.HEADER_EM, text);
      if (!r.ok) { log('skip', s.file, name, r.reason); continue; }
      r.templates.forEach(t => (aa[t.ch + '|h'] = aa[t.ch + '|h'] || []).push(t));
    }
    // --- anti-aliased bottom bar
    const boxes = L.readChannelBoxes(img, {});
    for (const [ch, text] of Object.entries(s.bottom)) {
      const r = App.ocr.harvestAA(img, boxes[ch].rect, L.BOTTOM_EM, text);
      if (!r.ok) { log('skip', s.file, 'bottom', ch, r.reason); continue; }
      r.templates.forEach(t => (aa[t.ch + '|b'] = aa[t.ch + '|b'] || []).push(t));
    }
    // --- bitmap axis labels
    for (let k = 1; k <= 11; k++) {
      if (k === 6) continue; // trigger-position triangle overlaps the centre label
      const t = s.pos + (k - 6) * s.tdiv;
      const text = Math.abs(t) < 1e-15 ? '0 s' : App.util.formatSI(t, 's');
      const o = L.xLabelOrigin(k);
      App.ocr.harvestBitmap(img, o.x, o.y, text).forEach(c => (small[c.ch] = small[c.ch] || []).push(c.bits));
    }
    const sel = s.channels[s.selected];
    for (let k = 1; k <= 10; k++) {
      const v = Math.round((sel.zeroY - (L.GRID.top + 60.4 * k)) / 60.4 * sel.vdiv * 1000) / 1000;
      const text = App.util.formatSI(v, 'V');
      const o = L.yLabelOrigin(k);
      App.ocr.harvestBitmap(img, o.x, o.y, text).forEach(c => (small[c.ch] = small[c.ch] || []).push(c.bits));
    }
  }

  // Majority vote per bitmap char, then drop outliers (cells disturbed by traces) and re-vote.
  const vote = arr => {
    const n = arr.length, len = arr[0].length; let out = '';
    for (let i = 0; i < len; i++) { let c = 0; arr.forEach(b => { if (b[i] === '1') c++; }); out += c * 2 > n ? '1' : '0'; }
    return out;
  };
  const ham = (a, b) => { let d = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++; return d; };
  const smallOut = {};
  for (const ch of Object.keys(small).sort()) {
    let v = vote(small[ch]);
    const good = small[ch].filter(b => ham(b, v) <= 4);
    if (good.length) v = vote(good);
    smallOut[ch] = [v];
    log('small', JSON.stringify(ch), 'n=' + small[ch].length, 'kept=' + good.length);
  }
  Object.assign(smallOut, Object.fromEntries(Object.entries(SYNTHETIC_GLYPHS.small).filter(([ch]) => !smallOut[ch])));

  // Average AA templates per (char, size class).
  const aaOut = [];
  for (const key of Object.keys(aa).sort()) {
    const arr = aa[key], n = arr.length, r2 = x => Math.round(x * 100) / 100;
    aaOut.push({
      ch: arr[0].ch,
      w: r2(arr.reduce((a, t) => a + t.w, 0) / n), h: r2(arr.reduce((a, t) => a + t.h, 0) / n), top: r2(arr.reduce((a, t) => a + t.top, 0) / n),
      f: arr[0].f.map((_, i) => r2(arr.reduce((a, t) => a + t.f[i], 0) / n)),
    });
    log('aa', key, 'n=' + n);
  }

  const js = '// GENERATED by tools/harvest.html via tools/build_glyphs.ps1 — do not edit by hand.\n' +
    '// small: bitmap axis-label font, 5x11 cells as "0"/"1" strings. aa: anti-aliased header font templates.\n' +
    '// Characters marked synthetic in tools/synthetic_glyphs.js are hand-drawn until a real sample exists.\n' +
    'App.GLYPHS = ' + JSON.stringify({ small: smallOut, aa: aaOut }) + ';\n';
  document.getElementById('out').textContent = js;
})().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e.message; });
</script>
</body></html>
